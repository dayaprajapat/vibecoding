<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f4ef">
  <title>Price Check</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f1f4ef;
      --surface: #fff;
      --ink: #172722;
      --muted: #6c7a73;
      --line: #d8e0d9;
      --green: #147457;
      --green-pale: #e6f4ec;
      --coral: #dc573e;
      --coral-pale: #fff0eb;
      --blue: #3159d9;
      --shadow: 0 12px 36px rgba(23, 39, 34, .07);
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(rgba(255, 255, 255, .35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .35) 1px, transparent 1px);
      background-size: 32px 32px;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    button, input, select { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
    .shell { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .brand-mark {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 7px 7px 7px 2px;
      color: white;
      background: var(--green);
      font-size: 15px;
    }
    .region { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .region-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    main { padding: 52px 0 64px; }
    .heading-row { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(32px, 5vw, 46px); font-weight: 500; line-height: 1.08; }
    .market-label { padding: 8px 11px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: rgba(255, 255, 255, .72); font-size: 11px; white-space: nowrap; }
    .search-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 130px auto;
      align-items: end;
      gap: 10px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field label { color: #56645d; font-size: 11px; font-weight: 700; }
    .field input, .field select {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: white;
    }
    .field input::placeholder { color: #98a49d; }
    .search-button {
      height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 4px;
      color: white;
      background: var(--green);
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }
    .search-button:hover { background: #105c45; }
    .search-button:active { transform: translateY(1px); }
    .search-button:disabled { opacity: .65; cursor: wait; }
    .status { min-height: 24px; padding: 12px 2px 4px; color: var(--muted); font-size: 12px; }
    .status.error { color: #a03b2b; }
    .comparison {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 6px 0 22px;
      padding: 14px 16px;
      border-left: 3px solid var(--green);
      background: var(--green-pale);
    }
    .comparison[hidden], .results[hidden] { display: none; }
    .comparison strong { font-size: 14px; }
    .comparison span { color: #52635a; font-size: 11px; text-align: right; }
    .results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
    .store { min-width: 0; }
    .store-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 0 11px; border-bottom: 1px solid var(--line); }
    .store-heading h2 { margin: 0; font-size: 15px; font-weight: 800; }
    .store-tag { color: var(--muted); font-size: 10px; }
    .product-list { display: grid; }
    .product {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 14px;
      padding: 15px 2px;
      border-bottom: 1px solid var(--line);
      animation: reveal .28s both;
    }
    .product-title { display: inline-block; color: var(--ink); font-size: 12px; font-weight: 600; line-height: 1.5; text-decoration: none; }
    .product-title:hover { color: var(--blue); text-decoration: underline; }
    .price { color: var(--green); font-size: 16px; font-weight: 800; white-space: nowrap; }
    .empty, .site-error { margin: 0; padding: 18px 2px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .site-error a { display: inline-block; margin-top: 8px; color: var(--blue); }
    .spinner { display: inline-block; width: 12px; height: 12px; margin-right: 7px; border: 2px solid #a8c6b7; border-top-color: var(--green); border-radius: 50%; vertical-align: -2px; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 680px) {
      .shell { width: min(100% - 28px, 520px); }
      main { padding-top: 34px; }
      .search-form { grid-template-columns: minmax(0, 1fr) 105px; padding: 12px; }
      .product-field { grid-column: 1 / -1; }
      .search-button { width: 100%; padding: 0 12px; }
      .results { grid-template-columns: 1fr; gap: 28px; }
    }
    @media (max-width: 400px) {
      .shell { width: calc(100% - 22px); }
      .heading-row { align-items: start; flex-direction: column; gap: 12px; }
      .market-label { padding: 6px 8px; }
      .search-form { grid-template-columns: minmax(0, 1fr); }
      .product-field { grid-column: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">P</span><span>PRICE CHECK</span></div>
      <div class="region"><span class="region-dot" aria-hidden="true"></span>India · INR</div>
    </header>

    <main>
      <div class="heading-row">
        <div>
          <p class="eyebrow">Amazon.in · Flipkart</p>
          <h1>Price comparison</h1>
        </div>
        <div class="market-label">Live search results</div>
      </div>

      <form class="search-form" id="search-form">
        <div class="field product-field">
          <label for="item">Product name</label>
          <input id="item" name="item" type="search" maxlength="200" placeholder="e.g. Noise powerbank 20000mAh" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="limit">Results per store</label>
          <select id="limit" name="limit">
            <option value="3" selected>3 results</option>
            <option value="5">5 results</option>
            <option value="10">10 results</option>
          </select>
        </div>
        <button class="search-button" id="search-button" type="submit">Compare prices</button>
      </form>

      <div class="status" id="status" role="status" aria-live="polite"></div>
      <section class="comparison" id="comparison" aria-live="polite" hidden></section>
      <section class="results" id="results" aria-label="Price search results" hidden></section>
    </main>
  </div>

  <script>
    const form = document.querySelector("#search-form");
    const itemInput = document.querySelector("#item");
    const limitInput = document.querySelector("#limit");
    const button = document.querySelector("#search-button");
    const status = document.querySelector("#status");
    const comparison = document.querySelector("#comparison");
    const results = document.querySelector("#results");
    const stores = [
      { key: "amazon", label: "Amazon" },
      { key: "flipkart", label: "Flipkart" },
    ];

    function makeElement(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderStore(store, payload) {
      const section = makeElement("section", "store");
      const heading = makeElement("div", "store-heading");
      heading.append(makeElement("h2", "", store.label));
      const entries = payload.results?.[store.key] || [];
      const error = payload.errors?.[store.key];
      heading.append(makeElement("span", "store-tag", error ? "Unavailable" : `${entries.length} listings`));
      section.append(heading);

      const list = makeElement("div", "product-list");
      if (error) {
        const message = makeElement("p", "site-error", error.message || "Could not load this store.");
        if (error.browser_search_url) {
          const link = makeElement("a", "", "Open store search");
          link.href = error.browser_search_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          message.append(document.createElement("br"), link);
        }
        list.append(message);
      } else if (!entries.length) {
        list.append(makeElement("p", "empty", "No matching listings found."));
      } else {
        for (const entry of entries) {
          const row = makeElement("article", "product");
          const title = makeElement("a", "product-title", entry.title);
          title.href = entry.url || "#";
          title.target = "_blank";
          title.rel = "noopener noreferrer";
          row.append(title, makeElement("strong", "price", entry.price));
          list.append(row);
        }
      }
      section.append(list);
      return section;
    }

    function renderComparison(value) {
      comparison.replaceChildren();
      comparison.hidden = !value;
      if (!value) return;
      const winner = value.cheaper_site === "tie"
        ? "Same listed price"
        : `${value.cheaper_site === "amazon" ? "Amazon" : "Flipkart"} is cheaper`;
      comparison.append(
        makeElement("strong", "", winner),
        makeElement("span", "", `${value.amazon_price} on Amazon · ${value.flipkart_price} on Flipkart`)
      );
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const item = itemInput.value.trim();
      if (!item) {
        itemInput.focus();
        return;
      }

      button.disabled = true;
      button.textContent = "Searching…";
      status.className = "status";
      status.replaceChildren(makeElement("span", "spinner"), document.createTextNode("Checking both stores"));
      results.hidden = true;
      comparison.hidden = true;

      try {
        const params = new URLSearchParams({ item, limit: limitInput.value });
        const response = await fetch(`/api/search?${params}`);
        if (!response.ok) throw new Error(`Search failed (${response.status}). Try again.`);
        const payload = await response.json();
        results.replaceChildren(...stores.map((store) => renderStore(store, payload)));
        renderComparison(payload.comparison);
        results.hidden = false;
        status.textContent = `Results for “${payload.query}”`;
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message || "Search failed. Try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Compare prices";
      }
    });
  </script>
</body>
</html>
